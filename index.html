<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Muhd Aiman</title>
    <style>
        /* 1. RESET & SYSTEM FONTS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 2. LATAR BELAKANG (Digital Network Theme via CSS) */
        body {
            background-color: #080b11;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(127, 0, 255, 0.04) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 25px 25px, 25px 25px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 3. STRUKTUR KAD & NEON DROP SHADOW */
        .profile-card {
            background: rgba(13, 18, 28, 0.9);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 35px 25px;
            color: #ffffff;
            backdrop-filter: blur(12px);
            /* Kesan Neon Drop Shadow Statik (Gabungan Cyan & Ungu) */
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.2), 0 0 15px rgba(127, 0, 255, 0.1);
            position: relative;
        }

        /* Hiasan nod digital kecil di sudut kad */
        .profile-card::before {
            content: '';
            position: absolute;
            top: 15px;
            right: 15px;
            width: 6px;
            height: 6px;
            background: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 8px #00f2fe, -12px 0 0 rgba(0, 242, 254, 0.4), 0 12px 0 rgba(0, 242, 254, 0.4);
        }

        /* 4. ELEMEN PROFIL (AVATAR) */
        .avatar-container {
            width: 85px;
            height: 85px;
            margin: 0 auto 18px;
            background: linear-gradient(135deg, #00f2fe, #7f00ff);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        .avatar-text {
            font-size: 32px;
            font-weight: 700;
            color: #080b11;
        }

        /* 5. TEKS UTAMA */
        .name {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            background: linear-gradient(to right, #ffffff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .role {
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #00f2fe;
            margin-bottom: 25px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 254, 0.3), transparent);
            margin: 20px 0;
        }

        /* 6. BAHAGIAN KANDUNGAN */
        .section {
            margin-bottom: 22px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Simbol hiasan menggantikan ikon luaran */
        .section-title::before {
            content: '▪';
            color: #00f2fe;
            font-size: 14px;
        }

        /* Susunan Butang Kemahiran */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-badge {
            font-size: 13px;
            background: rgba(0, 242, 254, 0.06);
            border: 1px solid rgba(0, 242, 254, 0.2);
            color: #e2e8f0;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 500;
        }

        /* Teks Fakta Menarik */
        .fact-text {
            font-size: 13.5px;
            color: #cbd5e1;
            line-height: 1.6;
            text-align: justify;
        }

        .highlight {
            color: #00f2fe;
            font-weight: 500;
        }

        /* 7. HUBUNGAN RINGKAS */
        .contact-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        .contact-item {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .contact-item:hover {
            color: #00f2fe;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        
        <!-- Avatar -->
        <div class="avatar-container">
            <span class="avatar-text">MA</span>
        </div>

        <!-- Profil Utama -->
        <h1 class="name">Muhd Aiman</h1>
        <p class="role">Technical Support</p>

        <div class="divider"></div>

        <!-- Bahagam Kemahiran -->
        <div class="section">
            <h2 class="section-title">Kemahiran</h2>
            <div class="skills-container">
                <span class="skill-badge">Linux</span>
                <span class="skill-badge">Powershell</span>
                <span class="skill-badge">Cmd</span>
            </div>
        </div>

        <!-- Bahagian Fakta Menarik -->
        <div class="section">
            <h2 class="section-title">Fakta Menarik</h2>
            <p class="fact-text">
                Peminat sukan pingpong yang kini meneroka dunia teknologi (i.e. <span class="highlight">Cloud server</span>, <span class="highlight">Onprem server</span>, <span class="highlight">Computer Network</span>).
            </p>
        </div>

        <div class="divider"></div>

        <!-- Hubungan Pudar (Placeholder) -->
        <div class="contact-bar">
            <a href="#" class="contact-item">Email</a>
            <a href="#" class="contact-item">LinkedIn</a>
            <a href="#" class="contact-item">GitHub</a>
        </div>

    </div>

</body>
</html>
