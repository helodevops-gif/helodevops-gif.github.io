<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Aiman</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .avatar {
            width: 96px;
            height: 96px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            color: white;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #f1f5f9;
        }

        .role {
            font-size: 16px;
            color: #3b82f6;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            margin-bottom: 12px;
            text-align: left;
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 24px;
        }

        .skill-tag {
            background-color: #334155;
            color: #e2e8f0;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .fun-fact {
            background-color: #111827;
            border-left: 4px solid #8b5cf6;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 14px;
            color: #cbd5e1;
            text-align: left;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar">A</div>
        
        <h1>Aiman</h1>
        <div class="role">Technical Support</div>
        
        <div class="section-title">Kemahiran</div>
        <div class="skills-container">
            <span class="skill-tag">Linux</span>
        </div>
        
        <div class="section-title">Fakta Menarik</div>
        <div class="fun-fact">
            Peminat sukan ping pong yang kini sedang meneroka dunia teknologi.
        </div>
    </div>

</body>
</html>
